version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyayasetu}
      POSTGRES_USER: ${POSTGRES_USER:-nyayasetu_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strong_db_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nyayasetu_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyayasetu_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - nyayasetu_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    env_file:
      - .env
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nyayasetu_network
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn -c gunicorn_config.py nyayasetu.wsgi:application"

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nyayasetu_network
    command: celery -A nyayasetu worker -l info --concurrency=2 -Q default_queue,ai_queue,notification_queue

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nyayasetu_network
    command: celery -A nyayasetu beat -l info

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    networks:
      - nyayasetu_network

  proxy:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - nyayasetu_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  nyayasetu_network:
    driver: bridge
