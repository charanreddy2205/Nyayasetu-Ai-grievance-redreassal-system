apiVersion: v1
kind: ConfigMap
metadata:
  name: nyayasetu-config
data:
  DJANGO_DEBUG: "False"
  ALLOWED_HOSTS: "nyayasetu.example.com,localhost"
  CSRF_TRUSTED_ORIGINS: "https://nyayasetu.example.com"
  REDIS_URL: "redis://redis-service:6379/1"
  CELERY_BROKER_URL: "redis://redis-service:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/0"
  POSTGRES_DB: "nyayasetu"
  POSTGRES_USER: "nyayasetu_admin"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"

---
apiVersion: v1
kind: Secret
metadata:
  name: nyayasetu-secrets
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "replace-with-base64-or-use-external-secret-store"
  POSTGRES_PASSWORD: "replace-with-db-password"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: django
          image: nyayasetu-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: nyayasetu-config
            - secretRef:
                name: nyayasetu-secrets
          readinessProbe:
            httpGet:
              path: /api/health/readiness/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/liveness/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: nginx
          image: nyayasetu-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: worker
          image: nyayasetu-backend:latest
          command: ["celery", "-A", "nyayasetu", "worker", "-l", "info", "-Q", "default_queue,ai_queue,notification_queue"]
          envFrom:
            - configMapRef:
                name: nyayasetu-config
            - secretRef:
                name: nyayasetu-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nyayasetu-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts:
        - nyayasetu.example.com
      secretName: nyayasetu-tls
  rules:
    - host: nyayasetu.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
