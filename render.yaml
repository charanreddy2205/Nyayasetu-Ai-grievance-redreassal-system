services:
  - type: web
    name: nyayasetu-backend
    env: python
    plan: free
    rootDir: nyayasetu
    buildCommand: |
      cd ..
      pip install -r requirements.txt
      cd nyayasetu
      python manage.py collectstatic --noinput
    startCommand: |
      python manage.py makemigrations && python manage.py migrate && python manage.py seed_data && gunicorn -c gunicorn_config.py nyayasetu.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.13"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "nyayasetu-backend.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: FRONTEND_URL
        value: "https://nyayasetu-frontend-740j.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: nyayasetu-db
          property: connectionString

  - type: web
    name: nyayasetu-frontend
    env: static
    rootDir: nyayasetu/frontend
    buildCommand: |
      npm install
      npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://nyayasetu-backend-wutc.onrender.com/api/*
      - type: rewrite
        source: /media/*
        destination: https://nyayasetu-backend-wutc.onrender.com/media/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://nyayasetu-backend-wutc.onrender.com"

databases:
  - name: nyayasetu-db
    plan: free
