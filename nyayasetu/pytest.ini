[pytest]
DJANGO_SETTINGS_MODULE = nyayasetu.settings
python_files = tests.py test_*.py *_tests.py
addopts = --cov=. --cov-report=term-missing --cov-report=html --no-migrations --reuse-db -v
markers =
    unit: Core unit tests
    integration: Integration tests for API and services
    ai: AI processing pipeline tests
    db: Database integrity and constraints tests
